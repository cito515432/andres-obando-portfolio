name: Validate static portfolio

on:
  push:
    branches: [main, portfolio-international-case-studies, portfolio-final-10-10-polish, portfolio-evidence-theme-polish-2026, final-recruiter-polish-2026]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
