name: Validate static portfolio

on:
  push:
    branches: [main, portfolio-international-case-studies, portfolio-final-10-10-polish]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: test -f out/index.html
      - run: test -f out/en/index.html && test -f out/fr/index.html && test -f out/pt/index.html
      - run: test -f out/en/case-studies/customer-churn-data-pipeline/index.html && test -f out/fr/case-studies/customer-churn-data-pipeline/index.html && test -f out/pt/case-studies/customer-churn-data-pipeline/index.html
