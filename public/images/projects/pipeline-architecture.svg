<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc"><title id="title">Customer churn data pipeline architecture</title><desc id="desc">CSV source flows through S3 raw, PySpark on EMR Serverless, processed and curated Parquet, AWS Glue, Athena, and analytics or machine learning.</desc><style>text{font-family:Arial,sans-serif;fill:#17212b} .box{fill:#f5f1e8;stroke:#1f6f5b;stroke-width:3} .arrow{stroke:#d46a4c;stroke-width:4;marker-end:url(#m)} .small{font-size:22px}.label{font-size:24px;font-weight:700}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d46a4c"/></marker></defs><rect width="1600" height="420" fill="#fffdf7"/><text x="800" y="52" text-anchor="middle" class="label">Customer Churn Data Pipeline</text><g transform="translate(35 145)"><rect class="box" width="170" height="110" rx="14"/><text x="85" y="50" text-anchor="middle" class="label">CSV</text><text x="85" y="80" text-anchor="middle" class="small">source data</text></g><g transform="translate(260 145)"><rect class="box" width="170" height="110" rx="14"/><text x="85" y="50" text-anchor="middle" class="label">S3 Raw</text><text x="85" y="80" text-anchor="middle" class="small">landing layer</text></g><g transform="translate(485 145)"><rect class="box" width="240" height="110" rx="14"/><text x="120" y="44" text-anchor="middle" class="label">PySpark</text><text x="120" y="76" text-anchor="middle" class="small">EMR Serverless</text></g><g transform="translate(780 145)"><rect class="box" width="240" height="110" rx="14"/><text x="120" y="44" text-anchor="middle" class="label">S3</text><text x="120" y="76" text-anchor="middle" class="small">processed / curated</text></g><g transform="translate(1075 145)"><rect class="box" width="170" height="110" rx="14"/><text x="85" y="50" text-anchor="middle" class="label">Glue</text><text x="85" y="80" text-anchor="middle" class="small">catalog</text></g><g transform="translate(1300 145)"><rect class="box" width="170" height="110" rx="14"/><text x="85" y="50" text-anchor="middle" class="label">Athena</text><text x="85" y="80" text-anchor="middle" class="small">query layer</text></g><path class="arrow" d="M205 200 H260"/><path class="arrow" d="M430 200 H485"/><path class="arrow" d="M725 200 H780"/><path class="arrow" d="M1020 200 H1075"/><path class="arrow" d="M1245 200 H1300"/><text x="1385" y="305" text-anchor="middle" class="small">analytics / ML</text></svg>